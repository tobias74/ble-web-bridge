name: blebridge-dev

services:
  dev-app:
    image: ble-web-bridge:dev
    build:
      context: .
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      WEB_DIST_DIR: /app/apps/web/dist
      HEART_RATE_ENABLED: ${HEART_RATE_ENABLED:-false}
      IDLE_TTL_MS: ${IDLE_TTL_MS:-60000}
      STALE_MS: ${STALE_MS:-10000}
      CLEANUP_INTERVAL_MS: ${CLEANUP_INTERVAL_MS:-15000}
      MAX_TELEMETRY_PER_SECOND: ${MAX_TELEMETRY_PER_SECOND:-10}
      MAX_COMMANDS_PER_SECOND: ${MAX_COMMANDS_PER_SECOND:-2}
      MAX_UNKNOWN_CODES_PER_MINUTE: ${MAX_UNKNOWN_CODES_PER_MINUTE:-60}
      MAX_UNKNOWN_CODES_GLOBALLY_PER_MINUTE: ${MAX_UNKNOWN_CODES_GLOBALLY_PER_MINUTE:-600}
      MAX_BATCH_CODES: ${MAX_BATCH_CODES:-50}
      MAX_PAYLOAD_BYTES: ${MAX_PAYLOAD_BYTES:-4096}
    expose:
      - "8787"
    networks:
      - public-edge
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/v1/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    labels:
      traefik.enable: "true"
      traefik.docker.network: bike-router-public
      traefik.http.routers.blebridge-dev-router.rule: "Host(`dev.blebridge.com`)"
      traefik.http.routers.blebridge-dev-router.entrypoints: websecure
      traefik.http.routers.blebridge-dev-router.tls.certresolver: letsencrypt
      traefik.http.routers.blebridge-dev-router.service: blebridge-dev-service
      traefik.http.services.blebridge-dev-service.loadbalancer.server.port: "8787"

networks:
  public-edge:
    external: true
    name: bike-router-public
